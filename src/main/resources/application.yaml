server:
  port: 9191

spring:
  application:
    name: ananta-kala-backend

#  datasource:
#    url: jdbc:postgresql://localhost:5432/ananta_kala_db
#    username: root
#    password: root

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    #This helps prevent accidental lazy-loading queries outside our service layer
    open-in-view: false
    hibernate:
      ddl-auto: validate
      default-schema: public
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        query:
          #This is a safeguard against future queries that Hibernate cannot safely paginate at the database level.
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

